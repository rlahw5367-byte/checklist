<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 내집마련 가이드 — 신혼부부 생애최초 매매</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1520;--bg2:#0F1D2D;--card:#141F2E;--card2:#111C2A;--card3:#0D1720;--gold:#E8B84B;--gold2:#D4956A;--text:#E5E7EB;--muted:#9CA3AF;--dim:#6B7280;--border:rgba(255,255,255,0.06)}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);min-height:100vh}
.wrap{max-width:600px;margin:0 auto;padding-bottom:80px}

/* HEADER */
.hdr{background:rgba(10,21,32,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(232,184,75,.13);position:sticky;top:0;z-index:100;padding:14px 16px 0}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdr-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#E8B84B,#D4956A);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hdr-title{font-size:15px;font-weight:800;color:var(--gold);letter-spacing:-.3px}
.hdr-sub{font-size:11px;color:var(--dim);margin-top:1px}
.tabs{display:flex;gap:8px;padding-bottom:14px}
.tab-btn{flex:1;padding:9px 0;border-radius:10px;font-size:12.5px;font-weight:700;border:none;cursor:pointer;transition:all .2s;background:var(--card);color:var(--dim);font-family:inherit}
.tab-btn.on{background:linear-gradient(135deg,#E8B84B,#D4956A);color:#0A1520}

/* PANELS */
.panel{padding:16px 16px 0;display:none}
.panel.on{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* BADGES */
.bdg{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:4px;vertical-align:middle}
.p1{background:#3D0A0A;color:#FF6B6B}.p2{background:#2D1500;color:#FF9E40}
.p3{background:#141E00;color:#A3CF62}.p4{background:#001530;color:#60A8DC}
.ess{background:#3D1515;color:#F87171}
.pill{border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700}
.s0{background:rgba(232,184,75,.15);color:#E8B84B}
.s1{background:rgba(91,155,213,.15);color:#5B9BD5}
.sx{background:rgba(107,114,128,.15);color:#6B7280}

/* PROGRESS */
.prg-wrap{background:linear-gradient(135deg,#1A2D20,#1A2535);border:1px solid rgba(232,184,75,.17);border-radius:18px;padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.ring-box{position:relative;flex-shrink:0;width:58px;height:58px}
.ring-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--gold)}
.prg-info{flex:1}
.prg-title{font-size:14px;font-weight:700;margin-bottom:4px}
.prg-status{font-size:11.5px;margin-bottom:6px}
.prg-bar{background:#0A1520;border-radius:4px;height:5px}
.prg-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#E8B84B,#F0D070);transition:width .4s ease}

/* LEGEND */
.legend{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.legend-ttl{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:8px}
.legend-row{display:flex;flex-wrap:wrap;gap:6px}

/* CAT ACCORDION */
.cat-wrap{margin-bottom:10px}
.cat-btn{width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .2s;font-family:inherit;text-align:left}
.cat-btn.on{border-radius:14px 14px 0 0}
.cat-emoji{font-size:18px;flex-shrink:0}
.cat-inf{flex:1;min-width:0}
.cat-name{font-size:13px;font-weight:700}
.cat-desc{font-size:11px;color:var(--dim);margin-top:2px}
.cat-bar-wrap{margin-top:5px;background:#0A1520;border-radius:3px;height:3px}
.cat-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.cat-meta{display:flex;align-items:center;gap:7px}
.cat-cnt{font-size:11.5px;color:var(--dim)}
.cat-chev{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}
.cat-items{background:var(--card2);border:1px solid transparent;border-top:none;border-radius:0 0 14px 14px;padding:12px 12px 8px;display:none}
.cat-items.on{display:block}

/* CHECK ITEM */
.ci{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px;margin-bottom:7px;overflow:hidden;transition:border-color .2s}
.ci-row{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;cursor:pointer}
.ci-circle{width:20px;height:20px;border-radius:50%;border:2px solid;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:background .15s;font-size:10px;font-weight:800;color:#0A1520}
.ci-body{flex:1;min-width:0}
.ci-bdgs{margin-bottom:3px}
.ci-txt{font-size:12.5px;line-height:1.5;color:var(--text)}
.ci-txt.done{text-decoration:line-through;color:#4B5563}
.ci-exp{background:none;border:none;cursor:pointer;color:#4B5563;font-size:10px;padding:0 2px;flex-shrink:0;margin-top:4px;font-family:inherit}
.ci-note{padding:0 12px 10px 42px;border-top:1px solid;display:none}
.ci-note.on{display:block}
.ci-note p{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.65}

/* TIP */
.tip{background:#1A1F2E;border:1px solid rgba(74,144,217,.18);border-radius:14px;padding:12px 14px;margin-top:8px}
.tip p{font-size:11.5px;color:var(--muted);line-height:1.7}

/* MINDMAP CENTER */
.center-nd{background:linear-gradient(135deg,#1A2D20,#1A2038);border:2px solid rgba(232,184,75,.2);border-radius:20px;padding:18px;text-align:center;margin-bottom:14px}
.c-icon{font-size:28px;margin-bottom:6px}
.c-title{font-size:15px;font-weight:800;color:var(--gold);letter-spacing:-.3px}
.c-sub{font-size:11px;color:var(--dim);margin-top:3px}
.c-tags{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.c-tag{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px}

/* BRANCH */
.br-wrap{margin-bottom:9px}
.br-btn{width:100%;background:var(--card);border:2px solid rgba(255,255,255,.06);border-radius:16px;padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .2s;font-family:inherit;text-align:left}
.br-btn.on{border-radius:16px 16px 0 0}
.br-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.br-inf{flex:1}
.br-lbl{font-size:14px;font-weight:800}
.br-sub{font-size:11px;color:var(--dim);margin-top:2px}
.br-chev{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.br-body{border:2px solid;border-top:none;border-radius:0 0 16px 16px;padding:12px 12px 6px;display:none}
.br-body.on{display:block}

/* NODE CARDS */
.nd{background:var(--card);border-radius:14px;margin-bottom:8px;overflow:hidden}
.nd-in{padding:12px 14px}
.nd-ttl{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px}

/* CALC */
.calc-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:8px;margin-bottom:4px}
.calc-lbl{font-size:11.5px;color:var(--muted)}
.calc-val{font-size:12px;text-align:right;max-width:58%;line-height:1.4}
.warn-box{padding:8px 14px 10px;border-top:1px solid}
.warn-box p{font-size:11.5px;color:#FCD34D;line-height:1.65}

/* Y/N */
.yn-q{font-size:13px;color:var(--text);line-height:1.5;font-weight:500;margin-bottom:10px}
.yn-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.yn-y{background:#0F2A1E;border:1px solid rgba(22,83,54,.3);border-radius:10px;padding:8px 10px}
.yn-n{background:#2A1010;border:1px solid rgba(83,49,22,.5);border-radius:10px;padding:8px 10px}
.yn-lbl{font-size:10px;font-weight:800;margin-bottom:3px}
.yn-y .yn-lbl{color:#34D399}.yn-n .yn-lbl{color:#FCA5A5}
.yn-y p{font-size:11.5px;color:#6EE7B7;line-height:1.5;margin:0}
.yn-n p{font-size:11.5px;color:#FCA5A5;line-height:1.5;margin:0}

/* DETAIL TOGGLE */
.dt-btn{width:100%;padding:6px 14px;background:none;border:none;border-top:1px solid;cursor:pointer;color:var(--dim);font-size:11px;text-align:left;font-family:inherit;transition:color .2s}
.dt-btn:hover{color:var(--muted)}
.dt-panel{padding:8px 14px 12px;background:var(--card3);display:none}
.dt-panel.on{display:block}
.dt-panel p{font-size:11.5px;color:var(--muted);line-height:1.7;white-space:pre-line;margin:0}

/* PRODUCT */
.prod{background:var(--card);border-radius:14px;margin-bottom:8px;overflow:hidden}
.prod-in{padding:12px 14px}
.prod-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.prod-name{font-size:13px;font-weight:700;color:var(--text)}
.prod-cond{font-size:11px;color:var(--muted);margin-bottom:6px}
.prod-res{border-radius:8px;padding:8px 10px}
.prod-res p{font-size:12.5px;font-weight:600;margin:0;line-height:1.5}

/* COMPARE */
.cmp-tbl{width:100%;border-collapse:collapse}
.cmp-hd th{padding:8px 10px;font-size:12px;font-weight:700}
.cmp-hd th:first-child{font-size:11px;color:var(--dim);text-align:left}
.cmp-tr td{padding:7px 10px;font-size:11px;line-height:1.4}
.cmp-tr td:first-child{font-size:11px;color:var(--muted)}
.cmp-tr td.a{color:#6EE7B7;text-align:center}
.cmp-tr td.b{text-align:center;color:var(--text)}
.cmp-tr td.bad{color:#FCA5A5}
.cmp-tr.e{background:#0D1720}.cmp-tr.o{background:#111C2A}

/* SOURCES */
.src{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:8px}
.src p{font-size:10.5px;color:var(--dim);line-height:1.8}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#1E2D3F;border-radius:2px}

/* ── MEMO TAB ── */
.memo-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.btn-add{flex:1;padding:11px 0;border-radius:12px;font-size:13px;font-weight:700;border:2px dashed #E8B84B55;background:rgba(232,184,75,.08);color:var(--gold);cursor:pointer;font-family:inherit;transition:all .2s}
.btn-add:hover{background:rgba(232,184,75,.15);border-color:var(--gold)}
.btn-exp{padding:11px 16px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid rgba(91,155,213,.3);background:rgba(91,155,213,.08);color:#5B9BD5;cursor:pointer;font-family:inherit;white-space:nowrap}
.empty-msg{text-align:center;padding:40px 20px;color:var(--dim);font-size:13px;line-height:1.8}
.empty-msg .em-icon{font-size:36px;margin-bottom:12px}

.prop-card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:18px;margin-bottom:14px;overflow:hidden;transition:border-color .2s}
.prop-card-hdr{display:flex;align-items:center;gap:10px;padding:14px 14px 0}
.prop-num{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#E8B84B,#D4956A);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0A1520;flex-shrink:0}
.prop-name-inp{flex:1;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.12);padding:4px 0;font-size:14px;font-weight:700;color:var(--text);font-family:inherit;outline:none}
.prop-name-inp::placeholder{color:var(--dim)}
.prop-del{width:28px;height:28px;border-radius:8px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:#F87171;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

.prop-stars{display:flex;gap:3px;padding:10px 14px 0}
.star-btn{font-size:22px;cursor:pointer;transition:transform .1s;background:none;border:none;line-height:1;padding:0}
.star-btn:hover{transform:scale(1.2)}

.prop-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px 0}
.prop-field{display:flex;flex-direction:column;gap:3px}
.prop-field.full{grid-column:1/-1}
.fld-lbl{font-size:10px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.fld-inp{background:var(--card2);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--text);font-family:inherit;outline:none;width:100%;transition:border-color .2s}
.fld-inp:focus{border-color:rgba(232,184,75,.4)}
.fld-inp::placeholder{color:#374151}
.link-row{display:flex;gap:6px;align-items:center}
.link-btn{padding:8px 10px;border-radius:8px;background:rgba(91,155,213,.12);border:1px solid rgba(91,155,213,.2);color:#5B9BD5;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:3px}

/* PHOTOS */
.photo-section{padding:12px 14px 0}
.photo-ttl{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px}
.photo-row{display:flex;gap:8px;flex-wrap:wrap}
.photo-thumb{position:relative;width:80px;height:80px;border-radius:10px;overflow:hidden;flex-shrink:0}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);border:none;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.photo-add-btn{width:80px;height:80px;border-radius:10px;border:2px dashed rgba(255,255,255,.15);background:rgba(255,255,255,.03);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10px;font-family:inherit}
.photo-add-btn span{font-size:22px}

/* MEMO SECTIONS */
.memo-section{padding:12px 14px 0}
.memo-tabs-row{display:flex;gap:5px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px}
.memo-tab-btn{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid rgba(255,255,255,.08);background:var(--card2);color:var(--dim);cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s;flex-shrink:0}
.memo-tab-btn.on{background:rgba(232,184,75,.15);border-color:rgba(232,184,75,.3);color:var(--gold)}
.memo-textarea{width:100%;min-height:90px;background:var(--card2);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;font-size:12.5px;color:var(--text);font-family:inherit;outline:none;resize:vertical;transition:border-color .2s;line-height:1.6}
.memo-textarea:focus{border-color:rgba(232,184,75,.3)}
.memo-textarea::placeholder{color:#374151}
.prop-card-footer{padding:12px 14px;margin-top:12px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:6px}
.rating-display{display:flex;gap:2px}
.score-lbl{font-size:11px;color:var(--muted);margin-left:4px}

/* ── COMPARE TAB ── */
.cmp-empty{text-align:center;padding:40px 20px;color:var(--dim);font-size:13px;line-height:1.8}
.cmp-header{background:var(--card);border:1px solid rgba(232,184,75,.15);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.cmp-header p{font-size:12px;color:var(--muted);line-height:1.6}
.cmp-cards{display:flex;flex-direction:column;gap:10px}
.cmp-prop{background:var(--card);border-radius:16px;overflow:hidden;border-left:4px solid}
.cmp-prop-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px}
.cmp-prop-name{font-size:14px;font-weight:800;flex:1}
.cmp-stars-big{font-size:16px;letter-spacing:1px}
.cmp-score-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800}
.cmp-fields{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cmp-field{padding:8px 14px;border-top:1px solid rgba(255,255,255,.05)}
.cmp-field .lbl{font-size:10px;color:var(--dim);font-weight:600;margin-bottom:2px}
.cmp-field .val{font-size:12.5px;color:var(--text);font-weight:500;line-height:1.4}
.cmp-memo-row{padding:10px 14px;border-top:1px solid rgba(255,255,255,.05)}
.cmp-memo-lbl{font-size:10px;color:var(--dim);font-weight:600;margin-bottom:4px}
.cmp-memo-txt{font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap}
.score-5{color:#34D399;background:rgba(52,211,153,.15)}
.score-4{color:#60A8DC;background:rgba(96,168,220,.15)}
.score-3{color:#E8B84B;background:rgba(232,184,75,.15)}
.score-2{color:#FF9E40;background:rgba(255,158,64,.15)}
.score-1{color:#FF6B6B;background:rgba(255,107,107,.15)}
.border-5{border-left-color:#34D399}
.border-4{border-left-color:#60A8DC}
.border-3{border-left-color:#E8B84B}
.border-2{border-left-color:#FF9E40}
.border-1{border-left-color:#FF6B6B}
.border-0{border-left-color:#374151}
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-icon">🏠</div>
    <div>
      <div class="hdr-title">내집마련 가이드</div>
      <div class="hdr-sub">무주택 신혼부부 · 생애최초 매매 · 2026 최신 기준</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn on" id="tb0" onclick="switchTab(0)">✅ 체크</button>
    <button class="tab-btn"    id="tb1" onclick="switchTab(1)">🧭 가이드</button>
    <button class="tab-btn"    id="tb2" onclick="switchTab(2)">📝 메모</button>
    <button class="tab-btn"    id="tb3" onclick="switchTab(3)">⚖️ 비교</button>
  </div>
</div>

<div id="p0" class="panel on"></div>
<div id="p1" class="panel"></div>
<div id="p2" class="panel"></div>
<div id="p3" class="panel"></div>

</div>
<script>
// ─── DATA ───────────────────────────────────────
const PRI={P1:{l:'P1 필수',c:'p1'},P2:{l:'P2 중요',c:'p2'},P3:{l:'P3 확인',c:'p3'},P4:{l:'P4 참고',c:'p4'}};

const CL=[
  {id:'legal',em:'⚖️',nm:'계약 전 법적 필수확인',col:'#FF6B6B',
   ds:'하나라도 빠지면 계약 파기·손실 가능 — 계약 당일이 아닌 반드시 사전 확인',
   it:[
    {id:'l1',pr:'P1',es:true,tx:'등기부등본 열람 — 근저당·가압류·압류·가처분·예고등기 전부 확인',
     nt:'법원 인터넷등기소(iros.go.kr). 단 1,000원. 잔금 당일 오전 한 번 더 발급 필수. 근저당 설정금이 시세 60% 초과 시 위험'},

// ─── HELPERS ───────────────────────────────────────
function ring(pct,col,sz=58){
  const r=(sz-8)/2,ci=2*Math.PI*r,off=ci-(pct/100)*ci;
  return `<svg width="${sz}" height="${sz}" style="transform:rotate(-90deg);flex-shrink:0"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#1E2D3F" stroke-width="5"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="${ci}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .5s ease" stroke-linecap="round"/></svg>`;
}
function prog(){
  const t=CL.reduce((s,c)=>s+c.it.length,0);
  const d=Object.values(S.checked).filter(Boolean).length;
  const bc={};CL.forEach(c=>{const x=c.it.filter(i=>S.checked[i.id]).length;bc[c.id]={d:x,t:c.it.length,p:Math.round(x/c.it.length*100)};});
  return{t,d,p:Math.round(d/t*100),bc};
}
function esDone(){return CL.flatMap(c=>c.it.filter(i=>i.es).map(i=>i.id)).every(id=>S.checked[id])}

// 이미지 압축 (max 500px, JPEG 0.65)
async function compressImg(file){
  return new Promise(res=>{
    const rd=new FileReader();
    rd.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=500;let w=img.width,h=img.height;
        if(w>h&&w>MAX){h=h*MAX/w;w=MAX;}else if(h>MAX){w=w*MAX/h;h=MAX;}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',0.65));
      };
      img.src=e.target.result;
    };
    rd.readAsDataURL(file);
  });
}

function delProp(id){

  let props=loadProps();props=props.filter(p=>p.id!==id);savePropsData(props);rMemoTab();
}

function setPF(id,field,val){
  const props=loadProps();const p=props.find(x=>x.id===id);if(!p)return;
  p[field]=val;savePropsData(props);
  // 링크 버튼 즉시 업데이트
  if(field==='link'){
    const row=document.querySelector(`#pc-${id} .link-row`);
    if(row){const btn=row.querySelector('.link-btn');
      if(val&&!btn){const a=document.createElement('a');a.href=val;a.target='_blank';a.className='link-btn';a.innerHTML='열기 ↗';row.appendChild(a);}
      else if(!val&&btn)btn.remove();
      else if(val&&btn)btn.href=val;

function setRating(id,stars){
  const props=loadProps();const p=props.find(x=>x.id===id);if(!p)return;
  p.rating=stars;savePropsData(props);
  // 별점 UI 즉시 업데이트
  const starsEl=document.querySelector(`#pc-${id} .prop-stars`);
  if(starsEl){
    const btns=starsEl.querySelectorAll('.star-btn');
    btns.forEach((b,i)=>{b.textContent=i<stars?'★':'☆';b.style.color=i<stars?'#E8B84B':'';});

  }
  const footer=document.querySelector(`#pc-${id} .rating-display`);

async function addPhoto(id,input){
  if(!input.files||!input.files[0])return;
  const props=loadProps();const p=props.find(x=>x.id===id);if(!p)return;
  if((p.photos||[]).length>=3){alert('사진은 최대 3장까지 추가할 수 있어요.');return;}
  const b64=await compressImg(input.files[0]);
  if(!p.photos)p.photos=[];p.photos.push(b64);
  if(!savePropsData(props))return;
  // 사진 행 업데이트
  const row=document.getElementById(`ph-row-${id}`);
  if(row){
    const thumb=document.createElement('div');thumb.className='photo-thumb';
    const idx=p.photos.length-1;
    thumb.innerHTML=`<img src="${b64}"><button class="photo-del" onclick="delPhoto('${id}',${idx})">✕</button>`;
    const addBtn=row.querySelector('label');
    if(addBtn)row.insertBefore(thumb,addBtn);else row.appendChild(thumb);
    if(p.photos.length>=3&&addBtn)addBtn.remove();
  }
}

function delPhoto(id,idx){
  const props=loadProps();const p=props.find(x=>x.id===id);if(!p)return;
  p.photos.splice(idx,1);savePropsData(props);
  const row=document.getElementById(`ph-row-${id}`);
  if(row){
    const thumbs=row.querySelectorAll('.photo-thumb');
    if(thumbs[idx])thumbs[idx].remove();
    // 삭제 버튼 인덱스 재할당
    row.querySelectorAll('.photo-thumb').forEach((t,i)=>{
      const btn=t.querySelector('.photo-del');if(btn)btn.setAttribute('onclick',`delPhoto('${id}',${i})`);
    });
    // 3장 미만이면 추가 버튼 복원
    if(p.photos.length<3&&!row.querySelector('label')){
      const lbl=document.createElement('label');lbl.className='photo-add-btn';
      lbl.innerHTML=`<span>📷</span>사진 추가<input type="file" accept="image/*" style="display:none" onchange="addPhoto('${id}',this)">`;
      row.appendChild(lbl);
    }
  }
}

function exportProps(){
  const props=loadProps();
  if(!props.length){alert('저장된 매물이 없어요.');return;}
  let txt='🏠 내집마련 임장 메모\n'+'='.repeat(40)+'\n생성일: '+new Date().toLocaleDateString('ko-KR')+'\n\n';
  props.forEach((p,i)=>{
    txt+=`[${i+1}] ${p.name||'이름 없는 매물'}\n`;
    txt+='─'.repeat(30)+'\n';
    if(p.price) txt+=`호가: ${p.price}\n`;
    if(p.area)  txt+=`면적: ${p.area}\n`;
    if(p.floor) txt+=`층/향: ${p.floor}\n`;
    if(p.year)  txt+=`입주연도: ${p.year}\n`;
    if(p.address)txt+=`주소: ${p.address}\n`;
    if(p.link)  txt+=`링크: ${p.link}\n`;
    if(p.rating)txt+=`별점: ${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)} (${p.rating}점)\n`;
    txt+='\n';
    MEMO_SECTIONS.forEach(s=>{
      const m=p.memos&&p.memos[s.k];
      if(m&&m.trim())txt+=`[${s.lb}]\n${m.trim()}\n\n`;
    });
    txt+='\n';
  });
  // 다운로드
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='임장_메모_'+new Date().toISOString().slice(0,10)+'.txt';
  a.click();URL.revokeObjectURL(a.href);
}

    });
    h+='</div>';
    // 간략 비교표
    h+=`<div style="background:var(--card);border-radius:14px;overflow:hidden;margin-top:14px">
      <div style="padding:10px 14px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.05)">📊 빠른 비교표</div>
      <table style="width:100%;border-collapse:collapse">
        <tr style="background:#0D1720">
          <th style="padding:8px 12px;font-size:11px;color:var(--dim);text-align:left;font-weight:600">매물명</th>
          <th style="padding:8px 8px;font-size:11px;color:var(--dim);text-align:center;font-weight:600">호가</th>
          <th style="padding:8px 8px;font-size:11px;color:var(--dim);text-align:center;font-weight:600">층/향</th>
          <th style="padding:8px 12px;font-size:11px;color:var(--dim);text-align:center;font-weight:600">별점</th>
        </tr>
        ${sorted.map((p,i)=>`
        <tr style="background:${i%2===0?'#141F2E':'#111C2A'}">
          <td style="padding:8px 12px;font-size:11.5px;color:var(--text);font-weight:${p.rating===Math.max(...props.map(x=>x.rating||0))?700:400}">${p.name||'—'}</td>
          <td style="padding:8px 8px;font-size:11.5px;color:#6EE7B7;text-align:center">${p.price||'—'}</td>
          <td style="padding:8px 8px;font-size:11px;color:var(--muted);text-align:center">${p.floor||'—'}</td>
          <td style="padding:8px 12px;text-align:center"><span class="cmp-score-badge ${scoreClass(p.rating||0)}" style="font-size:10px">${p.rating||0}★</span></td>
        </tr>`).join('')}
      </table>
    </div>`;
  }
  document.getElementById('p3').innerHTML=h;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

</script>
</body>
</html>
